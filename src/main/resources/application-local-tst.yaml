# Local testing profile.
#
# Same as `local` but connects to the actual (PostgreSQL) database instead of an
# in-memory H2. The datasource is the base default (see application.yaml); set
# PGHOST, PGPORT, PGDATABASE, PGUSER and PGPASSWORD.
#
# Activate with:  --spring.profiles.active=local-tst
spring:
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:resume_reviewer}
    driver-class-name: org.postgresql.Driver
    username: ${PGUSER:}
    password: ${PGPASSWORD:}
