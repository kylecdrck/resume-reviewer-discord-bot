# Local testing profile.
#
# Same as `local` but connects to the actual (PostgreSQL) database instead of an
# in-memory H2. Fill in the blank values below, or set the matching environment
# variables (DB_URL, DB_USERNAME, DB_PASSWORD).
#
# Activate with:  --spring.profiles.active=local-tst
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resume_reviewer}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
