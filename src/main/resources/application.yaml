spring:
  application:
    name: resume-reviewer

  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:resume_reviewer}
    driver-class-name: org.postgresql.Driver
    username: ${PGUSER:}
    password: ${PGPASSWORD:}
    hikari:
      max-lifetime: 30000         # 30 seconds - safely under Railway's proxy timeout
      keepalive-time: 15000       # 15 seconds - aggressively pings the socket
      idle-timeout: 10000         # Clean up idle connections quickly
      minimum-idle: 0             # Drop idle connections to 0 when bot is quiet
      maximum-pool-size: 5        # Keep pool small since Discord bots are often event-driven

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: ${LIQUIBASE_ENABLED:true}

  h2:
    console:
      enabled: false
      path: /h2-console

discord:
  enabled: ${DISCORD_ENABLED:true}
  token: ${DISCORD_TOKEN:}

llm:
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:auto}
  temperature: 0.3
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:120}
  reasoning-effort: ${LLM_REASONING_EFFORT:none}
  log-request: ${LLM_LOG_REQUEST:false}
  log-response: ${LLM_LOG_RESPONSE:false}
  max-tokens: ${LLM_MAX_TOKENS:2000}

review:
  confirmation-timeout-seconds: ${REVIEW_CONFIRMATION_TIMEOUT_SECONDS:45}

bot:
  config-form-timeout-seconds: ${BOT_CONFIG_FORM_TIMEOUT_SECONDS:300}
  config-cache-ttl-seconds: ${BOT_CONFIG_CACHE_TTL_SECONDS:60}

logging:
  level:
    dev.pandesal.resume_reviewer: INFO
    net.dv8tion.jda: INFO
